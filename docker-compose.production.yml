version: '3.8'

# ============================================================================
# PRODUCTION (single-host, non-Swarm) stack using pre-built GHCR images.
# ----------------------------------------------------------------------------
# For multi-node Docker Swarm deployments use the canonical stack instead:
#   docker-compose.swarm-optimized.yml
#
# The browser-automation service is a SINGLE, horizontally scalable service so
# you can run:  docker compose -f docker-compose.production.yml up -d --scale browser-automation=10
# ============================================================================

volumes:
  personas-data:
    driver: local

services:
  # Selenium Hub
  selenium-hub:
    image: selenium/hub:latest
    # SECURITY: the hub port (4444) is intentionally NOT published to the host,
    # so the Selenium grid is not exposed. The browser nodes and the automation
    # containers reach it over the internal compose network as "selenium-hub:4444".
    # If you need the grid UI from the host, put it behind an authenticated
    # reverse proxy rather than publishing 4444 directly.
    environment:
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_MAX_SESSIONS=25
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
      - SE_SESSION_TIMEOUT=300

  # Chrome Nodes
  chrome-latest:
    image: selenium/node-chrome:latest
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    shm_size: 2gb

  chrome-120:
    image: selenium/node-chrome:120.0
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    shm_size: 2gb

  # Firefox Nodes
  firefox-latest:
    image: selenium/node-firefox:latest
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    shm_size: 2gb

  firefox-120:
    image: selenium/node-firefox:120.0
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    shm_size: 2gb

  # Edge Nodes
  edge-latest:
    image: selenium/node-edge:latest
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    shm_size: 2gb

  # Browser Automation (using GHCR image)
  # SCALABLE: this is a single service with no container_name and no host ports,
  # so it can be scaled to N replicas:
  #   docker compose -f docker-compose.production.yml up -d --scale browser-automation=10
  browser-automation:
    image: ghcr.io/boblepointu/adnauseamselenium:latest
    depends_on:
      - selenium-hub
      - chrome-latest
      - chrome-120
      - firefox-latest
      - firefox-120
      - edge-latest
    volumes:
      - personas-data:/app/data/personas
    environment:
      - SELENIUM_HUB=${SELENIUM_HUB:-selenium-hub:4444}
      - PERSONA_ROTATION_STRATEGY=${PERSONA_ROTATION_STRATEGY:-weighted}
      - PERSONA_MAX_AGE_DAYS=${PERSONA_MAX_AGE_DAYS:-30}
      - PERSONA_MAX_USES=${PERSONA_MAX_USES:-100}
    restart: unless-stopped
