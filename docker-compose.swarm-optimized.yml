  # ============================================
  # BROWSER AUTOMATION - 2 replicas, 384MB each
  # Total: 2 × 384MB = 768MB
  # ============================================
  browser-automation:
    image: ghcr.io/boblepointu/adnauseamselenium:latest
    networks:
      - selenium-network
    # Override VOLUME directive with tmpfs to prevent mount thrashing
    volumes:
      - type: tmpfs
        target: /app/data/personas
        tmpfs:
          size: 104857600
    environment:
      - SELENIUM_HUB=${SELENIUM_HUB:-selenium-hub:4444}
      - PERSONA_ROTATION_STRATEGY=weighted
      - PERSONA_MAX_AGE_DAYS=30
      - PERSONA_MAX_USES=100
    deploy:
      replicas: ${BROWSER_AUTOMATION_REPLICAS:-2}
      placement:
        constraints:
          - node.labels.role == ${BROWSER_NODE_ROLE:-browser}
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      resources:
        limits:
          memory: ${BROWSER_AUTOMATION_MEM_LIMIT:-512M}
          cpus: '0.5'
        reservations:
          memory: ${BROWSER_AUTOMATION_MEM_RESERVATION:-384M}
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback

networks:
  traefik-public:
    external: true
  selenium-network:
    driver: overlay
    attachable: true

