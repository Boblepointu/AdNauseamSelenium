version: '3.8'

# ============================================================================
# CANONICAL SWARM STACK  (docker stack deploy -c docker-compose.swarm-optimized.yml adnauseam)
# ----------------------------------------------------------------------------
# This is the single source of truth for Docker Swarm deployments.
# (The former docker-compose.swarm.yml / docker-compose.swarm-fixed.yml variants
#  have been removed in favor of this file.)
#
# All tunables are environment variables with sane defaults (see .env.example).
# Copy .env.example to .env and adjust before deploying.
#
# NODE PLACEMENT: services are pinned to nodes carrying the label
#   role=${BROWSER_NODE_ROLE:-browser}
# Label your worker node(s) once with:
#   docker node update --label-add role=browser <node-name>
# ============================================================================

services:
  # ============================================
  # SELENIUM HUB - 2GB RAM
  # ============================================
  selenium-hub:
    image: selenium/hub:latest
    # SECURITY: raw host port publishes for the Selenium grid removed.
    # 4444 (hub API) and 4442/4443 (event bus) must NOT be exposed on the host.
    # The hub stays reachable to browser nodes over the internal 'selenium-network'
    # overlay, and to operators only through the authenticated Traefik router below.
    networks:
      - traefik-public
      - selenium-network
    environment:
      - GRID_MAX_SESSION=150
      - GRID_BROWSER_TIMEOUT=60
      - GRID_TIMEOUT=60
      - SE_SESSION_REQUEST_TIMEOUT=30
      - SE_NODE_SESSION_TIMEOUT=30
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: ${SELENIUM_HUB_REPLICAS:-1}
      placement:
        constraints:
          - node.labels.role == ${BROWSER_NODE_ROLE:-browser}
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
      resources:
        limits:
          memory: ${SELENIUM_HUB_MEM_LIMIT:-3G}
        reservations:
          memory: ${SELENIUM_HUB_MEM_RESERVATION:-2G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.selenium.rule=Host(`${SELENIUM_HOST:-selenium.local}`)"
        - "traefik.http.routers.selenium.entrypoints=web"
        - "traefik.http.routers.selenium.middlewares=selenium-redirect"
        - "traefik.http.routers.selenium-secure.rule=Host(`${SELENIUM_HOST:-selenium.local}`)"
        - "traefik.http.routers.selenium-secure.entrypoints=websecure"
        - "traefik.http.routers.selenium-secure.tls=true"
        - "traefik.http.routers.selenium-secure.tls.certresolver=letsencrypt"
        - "traefik.http.routers.selenium-secure.middlewares=auth@swarm"
        - "traefik.http.services.selenium.loadbalancer.server.port=4444"
        - "traefik.http.middlewares.selenium-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.selenium-redirect.redirectscheme.permanent=true"

  # ============================================
  # CHROME NODES - 1 replica each, 768MB RAM
  # Total: 8 × 768MB = 6GB
  # ============================================
  chrome-95:
    image: selenium/node-chrome:95.0
    networks:
      - selenium-network
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_OTEL_TRACES_EXPORTER=none
      - SE_ENABLE_TRACING=false
    # NOTE: service-level shm_size is IGNORED by 'docker stack deploy'.
    # Mount a 2GB tmpfs at /dev/shm so Chrome/Firefox don't crash on large pages.
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 2147483648
    deploy:
      replicas: ${NODE_REPLICAS:-1}
      placement:
        constraints:
          - node.labels.role == ${BROWSER_NODE_ROLE:-browser}
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          memory: ${NODE_MEM_LIMIT:-1G}
        reservations:
          memory: ${NODE_MEM_RESERVATION:-768M}

