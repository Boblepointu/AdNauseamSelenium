# Reproducible single-host deployment: Selenium Grid (hub + chrome/firefox/edge
# nodes) plus N crawler replicas pulling the published GHCR image.
#
#   cd deploy && docker compose -f docker-compose.grid.yml up -d --scale crawler=5
#
# Concurrency == crawler replicas (each process is single-threaded by design).
# Nodes accept up to 5 sessions each so the grid can serve 5 concurrent crawlers
# regardless of which browsers they pick.
#
# NOTE: on hosts whose Docker default address pools are exhausted, add an explicit
# free subnet under `networks.default.ipam` (see the commented block at the bottom).

name: adnauseam

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-node-env: &node-env
  SE_EVENT_BUS_HOST: selenium-hub
  SE_EVENT_BUS_PUBLISH_PORT: "4442"
  SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
  SE_NODE_MAX_SESSIONS: "5"
  SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
  SE_NODE_SESSION_TIMEOUT: "1800"   # was 300 — too short; killed long crawl sessions

services:
  selenium-hub:
    image: selenium/hub:4.27.0
    container_name: adnauseam-hub
    ports:
      - "127.0.0.1:4444:4444"   # localhost-only; reach via SSH tunnel, not the LAN
    environment:
      SE_ROUTER_HEALTHCHECK: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  node-chrome:
    image: selenium/node-chrome:4.27.0
    container_name: adnauseam-node-chrome
    depends_on: [selenium-hub]
    shm_size: 2gb
    environment: *node-env
    mem_limit: 6g
    logging: *logging
    restart: unless-stopped

  node-firefox:
    image: selenium/node-firefox:4.27.0
    container_name: adnauseam-node-firefox
    depends_on: [selenium-hub]
    shm_size: 2gb
    environment: *node-env
    mem_limit: 6g
    logging: *logging
    restart: unless-stopped

  node-edge:
    image: selenium/node-edge:4.27.0
    container_name: adnauseam-node-edge
    depends_on: [selenium-hub]
    shm_size: 2gb
    environment: *node-env
    mem_limit: 6g
    logging: *logging
    restart: unless-stopped

  crawler:
    image: ghcr.io/boblepointu/adnauseamselenium:latest
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SELENIUM_HUB: "selenium-hub:4444"
      LOG_LEVEL: "INFO"
      PERSONA_ROTATION_STRATEGY: "weighted"
      WEBDRIVER_COMMAND_TIMEOUT: "120"
    labels:
      autoheal: "true"   # autoheal restarts this container if it goes unhealthy
    mem_limit: 768m
    logging: *logging
    restart: unless-stopped
    deploy:
      replicas: 5

  # restart:unless-stopped does NOT restart an *unhealthy* container (only on exit).
  # The crawler's heartbeat healthcheck flips unhealthy if a browse loop wedges, so
  # autoheal watches for that and restarts it. Scoped by the `autoheal=true` label,
  # so it never touches other containers on the host.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: adnauseam-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging
    restart: unless-stopped

# On a host with free default pools, Docker auto-assigns the network. If you hit
# "could not find an available, non-overlapping IPv4 address pool", pin one:
#
# networks:
#   default:
#     name: adnauseam_net
#     ipam:
#       config:
#         - subnet: 172.16.240.0/24
